# ── Shared Airflow config ──────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    PYTHONPATH: /opt/airflow
    DLT_PIPELINES_DIR: /opt/airflow/.dlt 
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__API__AUTH_BACKENDS: >-
      airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # Pass all env vars into the Airflow environment so DAGs can read them
    ERP_API_KEY: ${ERP_API_KEY}
    ERP_BASE_URL: ${ERP_BASE_URL}
    LAKE_POSTGRES_HOST: ${LAKE_POSTGRES_HOST}
    LAKE_POSTGRES_PORT: ${LAKE_POSTGRES_PORT}
    LAKE_POSTGRES_DB: ${LAKE_POSTGRES_DB}
    LAKE_POSTGRES_USER: ${LAKE_POSTGRES_USER}
    LAKE_POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD}
    WAREHOUSE_POSTGRES_HOST: ${WAREHOUSE_POSTGRES_HOST}
    WAREHOUSE_POSTGRES_PORT: ${WAREHOUSE_POSTGRES_PORT}
    WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB}
    WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER}
    WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Mount source code so DAGs can import extractor, dlt, and dbt
    - ./extractor:/opt/airflow/extractor
    - ./dlt_pipeline:/opt/airflow/dlt_pipeline
    - ./dbt_project:/opt/airflow/dbt_project
    - dlt_state:/opt/airflow/.dlt  
  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: unless-stopped

# ── Services ───────────────────────────────────────────────────────────────────
services:

  # ── 1. Lake database ─────────────────────────────────────────────────────────
  lake-postgres:
    image: postgres:15
    container_name: retailco-lake
    environment:
      POSTGRES_USER: ${LAKE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LAKE_POSTGRES_DB}
    ports:
      - "5433:5432"          # host:container — access from your machine at localhost:5433
    volumes:
      - lake_pgdata:/var/lib/postgresql/data
      - ./postgres/lake-init:/docker-entrypoint-initdb.d   # auto-runs SQL on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LAKE_POSTGRES_USER} -d ${LAKE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. Warehouse database ─────────────────────────────────────────────────────
  warehouse-postgres:
    image: postgres:15
    container_name: retailco-warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB}
    ports:
      - "5434:5432"          # host:container — access from your machine at localhost:5434
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
      - ./postgres/warehouse-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_POSTGRES_USER} -d ${WAREHOUSE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 3. Airflow metadata database ──────────────────────────────────────────────
  airflow-postgres:
    image: postgres:15
    container_name: retailco-airflow-meta
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Not exposed on host — only Airflow containers need to reach it

  # ── 4. Airflow init (runs once, then exits) ────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: retailco-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@retailco.ng \
          --password admin
        echo "Airflow initialised"
    restart: "no"           # run once and stop — not unless-stopped

  # ── 5. Airflow webserver ───────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: retailco-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      lake-postgres:
        condition: service_healthy
      warehouse-postgres:
        condition: service_healthy

  # ── 6. Airflow scheduler ────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: retailco-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      lake-postgres:
        condition: service_healthy
      warehouse-postgres:
        condition: service_healthy

# ── Named volumes (persist data across container restarts) ────────────────────
volumes:
  lake_pgdata:
  warehouse_pgdata:
  airflow_pgdata:
  dlt_state:    # always reset together with warehouse_pgdata — never wipe one without the other
  
