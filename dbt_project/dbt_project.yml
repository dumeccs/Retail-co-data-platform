name: 'retailco_dbt'
version: '1.0.0'
config-version: 2

profile: 'retailco'

model-paths:    ["models"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path:    "target"
clean-targets:  ["target", "dbt_packages"]

models:
  retailco_dbt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      dimensions:
        +materialized: table
      facts:
        +materialized: table
      data_quality:
        +materialized: table

snapshots:
  retailco_dbt:
    +target_schema: snapshots
    +invalidate_hard_deletes: false



